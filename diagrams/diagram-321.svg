<svg id="mdiagram-321" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 355.65625px;" viewBox="4 4 355.65625 787" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mdiagram-321{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mdiagram-321 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mdiagram-321 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mdiagram-321 .error-icon{fill:#552222;}#mdiagram-321 .error-text{fill:#552222;stroke:#552222;}#mdiagram-321 .edge-thickness-normal{stroke-width:1px;}#mdiagram-321 .edge-thickness-thick{stroke-width:3.5px;}#mdiagram-321 .edge-pattern-solid{stroke-dasharray:0;}#mdiagram-321 .edge-thickness-invisible{stroke-width:0;fill:none;}#mdiagram-321 .edge-pattern-dashed{stroke-dasharray:3;}#mdiagram-321 .edge-pattern-dotted{stroke-dasharray:2;}#mdiagram-321 .marker{fill:#333333;stroke:#333333;}#mdiagram-321 .marker.cross{stroke:#333333;}#mdiagram-321 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mdiagram-321 p{margin:0;}#mdiagram-321 .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#mdiagram-321 .cluster-label text{fill:#333;}#mdiagram-321 .cluster-label span{color:#333;}#mdiagram-321 .cluster-label span p{background-color:transparent;}#mdiagram-321 .label text,#mdiagram-321 span{fill:#333;color:#333;}#mdiagram-321 .node rect,#mdiagram-321 .node circle,#mdiagram-321 .node ellipse,#mdiagram-321 .node polygon,#mdiagram-321 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mdiagram-321 .rough-node .label text,#mdiagram-321 .node .label text,#mdiagram-321 .image-shape .label,#mdiagram-321 .icon-shape .label{text-anchor:middle;}#mdiagram-321 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#mdiagram-321 .rough-node .label,#mdiagram-321 .node .label,#mdiagram-321 .image-shape .label,#mdiagram-321 .icon-shape .label{text-align:center;}#mdiagram-321 .node.clickable{cursor:pointer;}#mdiagram-321 .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#mdiagram-321 .arrowheadPath{fill:#333333;}#mdiagram-321 .edgePaths .path{stroke:#333333;stroke-width:1px;}#mdiagram-321 .flowchart-link{stroke:#333333;fill:none;}#mdiagram-321 .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#mdiagram-321 .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#mdiagram-321 .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#mdiagram-321 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#mdiagram-321 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#mdiagram-321 .cluster text{fill:#333;}#mdiagram-321 .cluster span{color:#333;}#mdiagram-321 .node .collapsed-indicator{fill:#aaaa33;stroke:none;opacity:0.6;}#mdiagram-321 .node .collapsed-separator{stroke:#aaaa33;stroke-width:0.75px;}#mdiagram-321 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#mdiagram-321 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#mdiagram-321 rect.text{fill:none;stroke-width:0;}#mdiagram-321 .icon-shape,#mdiagram-321 .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#mdiagram-321 .icon-shape p,#mdiagram-321 .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#mdiagram-321 .icon-shape .label rect,#mdiagram-321 .image-shape .label rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#mdiagram-321 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#mdiagram-321 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#mdiagram-321 .node .neo-node{stroke:#9370DB;}#mdiagram-321 [data-look="neo"].node rect,#mdiagram-321 [data-look="neo"].cluster rect,#mdiagram-321 [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdiagram-321 [data-look="neo"].swimlane.cluster rect{filter:none;}#mdiagram-321 [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mdiagram-321 [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdiagram-321 [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mdiagram-321 [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdiagram-321 [data-look="neo"].node circle .state-start{fill:#000000;}#mdiagram-321 [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdiagram-321 [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdiagram-321 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="mdiagram-321_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="mdiagram-321_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="mdiagram-321_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="us