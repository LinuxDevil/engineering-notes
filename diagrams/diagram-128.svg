<svg id="mdiagram-128" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 552px;" viewBox="4 4 552 312" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mdiagram-128{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mdiagram-128 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mdiagram-128 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mdiagram-128 .error-icon{fill:#552222;}#mdiagram-128 .error-text{fill:#552222;stroke:#552222;}#mdiagram-128 .edge-thickness-normal{stroke-width:1px;}#mdiagram-128 .edge-thickness-thick{stroke-width:3.5px;}#mdiagram-128 .edge-pattern-solid{stroke-dasharray:0;}#mdiagram-128 .edge-thickness-invisible{stroke-width:0;fill:none;}#mdiagram-128 .edge-pattern-dashed{stroke-dasharray:3;}#mdiagram-128 .edge-pattern-dotted{stroke-dasharray:2;}#mdiagram-128 .marker{fill:#333333;stroke:#333333;}#mdiagram-128 .marker.cross{stroke:#333333;}#mdiagram-128 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mdiagram-128 p{margin:0;}#mdiagram-128 .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#mdiagram-128 .cluster-label text{fill:#333;}#mdiagram-128 .cluster-label span{color:#333;}#mdiagram-128 .cluster-label span p{background-color:transparent;}#mdiagram-128 .label text,#mdiagram-128 span{fill:#333;color:#333;}#mdiagram-128 .node rect,#mdiagram-128 .node circle,#mdiagram-128 .node ellipse,#mdiagram-128 .node polygon,#mdiagram-128 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mdiagram-128 .rough-node .label text,#mdiagram-128 .node .label text,#mdiagram-128 .image-shape .label,#mdiagram-128 .icon-shape .label{text-anchor:middle;}#mdiagram-128 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#mdiagram-128 .rough-node .label,#mdiagram-128 .node .label,#mdiagram-128 .image-shape .label,#mdiagram-128 .icon-shape .label{text-align:center;}#mdiagram-128 .node.clickable{cursor:pointer;}#mdiagram-128 .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#mdiagram-128 .arrowheadPath{fill:#333333;}#mdiagram-128 .edgePaths .path{stroke:#333333;stroke-width:1px;}#mdiagram-128 .flowchart-link{stroke:#333333;fill:none;}#mdiagram-128 .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#mdiagram-128 .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#mdiagram-128 .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#mdiagram-128 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#mdiagram-128 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#mdiagram-128 .cluster text{fill:#333;}#mdiagram-128 .cluster span{color:#333;}#mdiagram-128 .node .collapsed-indicator{fill:#aaaa33;stroke:none;opacity:0.6;}#mdiagram-128 .node .collapsed-separator{stroke:#aaaa33;stroke-width:0.75px;}#mdiagram-128 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#mdiagram-128 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#mdiagram-128 rect.text{fill:none;stroke-width:0;}#mdiagram-128 .icon-shape,#mdiagram-128 .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#mdiagram-128 .icon-shape p,#mdiagram-128 .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#mdiagram-128 .icon-shape .label rect,#mdiagram-128 .image-shape .label rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#mdiagram-128 .label-icon{display:inline-block;height:1em;overflow:visibl