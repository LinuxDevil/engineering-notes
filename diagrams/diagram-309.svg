<svg id="mdiagram-309" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 696px;" viewBox="4 4 696 505" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mdiagram-309{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mdiagram-309 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mdiagram-309 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mdiagram-309 .error-icon{fill:#552222;}#mdiagram-309 .error-text{fill:#552222;stroke:#552222;}#mdiagram-309 .edge-thickness-normal{stroke-width:1px;}#mdiagram-309 .edge-thickness-thick{stroke-width:3.5px;}#mdiagram-309 .edge-pattern-solid{stroke-dasharray:0;}#mdiagram-309 .edge-thickness-invisible{stroke-width:0;fill:none;}#mdiagram-309 .edge-pattern-dashed{stroke-dasharray:3;}#mdiagram-309 .edge-pattern-dotted{stroke-dasharray:2;}#mdiagram-309 .marker{fill:#333333;stroke:#333333;}#mdiagram-309 .marker.cross{stroke:#333333;}#mdiagram-309 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mdiagram-309 p{margin:0;}#mdiagram-309 .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#mdiagram-309 .cluster-label text{fill:#333;}#mdiagram-309 .cluster-label span{color:#333;}#mdiagram-309 .cluster-label span p{background-color:transparent;}#mdiagram-309 .label text,#mdiagram-309 span{fill:#333;color:#333;}#mdiagram-309 .node rect,#mdiagram-309 .node circle,#mdiagram-309 .node ellipse,#mdiagram-309 .node polygon,#mdiagram-309 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mdiagram-309 .rough-node .label text,#mdiagram-309 .node .label text,#mdiagram-309 .image-shape .label,#mdiagram-309 .icon-shape .label{text-anchor:middle;}#mdiagram-309 .n