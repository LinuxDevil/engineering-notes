<svg id="mdiagram-141" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 696px;" viewBox="4 4 696 355" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mdiagram-141{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mdiagram-141 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mdiagram-141 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mdiagram-141 .error-icon{fill:#552222;}#mdiagram-141 .error-text{fill:#552222;stroke:#552222;}#mdiagram-141 .edge-thickness-normal{stroke-width:1px;}#mdiagram-141 .edge-thickness-thick{stroke-width:3.5px;}#mdiagram-141 .edge-pattern-solid{stroke-dasharray:0;}#mdiagram-141 .edge-thickness-invisible{stroke-width:0;fill:none;}#mdiagram-141 .edge-pattern-dashed{stroke-dasharray:3;}#mdiagram-141 .edge-pattern-dotted{stroke-dasharray:2;}#mdiagram-141 .marker{fill:#333333;stroke:#333333;}#mdiagram-141 .marker.cross{stroke:#333333;}#mdiagram-141 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mdiagram-141 p{margin:0;}#mdiagram-141 .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#mdiagram-141 .cluster-label text{fill:#333;}#mdiagram-141 .cluster-label span{color:#333;}#mdiagram-141 .cluster-label span p{background-color:transparent;}#mdiagram-141 .label text,#mdiagram-141 span{fill:#333;color:#333;}#mdiagram-141 .node rect,#mdiagram-141 .node circle,#mdiagram-141 .node ellipse,#mdiagram-141 .node polygon,#mdiagram-141 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mdiagram-141 .rough-node .label text,#mdiagram-141 .node .label text,#mdiagram-141 .image-shape .label,#mdiagram-141 .icon-shape .label{text-anchor:middle;}#mdiagram-141 .n