ible;vertical-align:-0.125em;}#mdiagram-090 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#mdiagram-090 .node .neo-node{stroke:#9370DB;}#mdiagram-090 [data-look="neo"].node rect,#mdiagram-090 [data-look="neo"].cluster rect,#mdiagram-090 [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdiagram-090 [data-look="neo"].swimlane.cluster rect{filter:none;}#mdiagram-090 [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mdiagram-090 [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdiagram-090 [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#mdiagram-090 [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdiagram-090 [data-look="neo"].node circle .state-start{fill:#000000;}#mdiagram-090 [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdiagram-090 [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mdiagram-090 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="mdiagram-090_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="mdiagram-090_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="mdiagram-090_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOn